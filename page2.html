<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to your surprise</title>

    <link rel="stylesheet" href="page2.css">
</head>
<body>

    <main class="sky">

        <!-- Lua e estrelas -->
        <div class="moon"></div>

        <div class="stars">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>✦</span>
            <span>·</span>
        </div>

        <!-- Nuvens animadas -->
        <div class="clouds">
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
            <div class="cloud cloud-three"></div>
        </div>

        <!-- Conteúdo principal -->
        <section class="welcome-content">

            <h1>Welcome to your surprise!</h1>

            <p class="birthday-message">
                YYAAY! Today is your birthday!🎉🎂<br>
                Did you think I would forget your birthday? No way!
                i dare you to click the "NO" button ;P
                
            </p>

            <div class="buttons-area">

                <button id="no-button">
                    No
                </button>

                <button id="continue-button">
                    Continue>
                </button>

            </div>

        </section>

    </main>

    <script src="page2.js"></script>

</body>
</html>
